name: CI

# Follows the CI baseline in dotfiles' .claude/rules/ci-baseline.md. Each `qa:` job
# runs one mise task by name; a new `qa:` task needs a job here, and a new job a
# place in the main ruleset's required checks before a merge waits on it.

on:
  # No path filter: these checks are required status checks on main, so they must
  # report on every PR (a check that never runs would block merges forever).
  pull_request:
  push:
    branches: [main]
  # Weekly: both secret scans cover the whole history on a scheduled run, and every
  # job meets this week's release of the tools mise.toml tracks at `latest` even
  # when no PR comes in.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # Each job installs only what its task needs, so `mise run` must not install the
  # rest of mise.toml's tools.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rumdl
          # mise.toml tracks these tools at `latest`, and a restored cache would hold
          # each at the release it was first saved with until mise.toml changed.
          cache: false
      - run: mise run qa:md

  shell-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: shellcheck shfmt
          cache: false # as in `markdown-lint`
      - run: mise run qa:sh

  js-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: biome node
          cache: false # as in `markdown-lint`
      - run: mise run qa:js

  link-check-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: lychee
          cache: false # as in `markdown-lint`
      - run: mise run qa:links:offline

  # The two scans mirror the local pair, gitleaks per commit and trufflehog per push,
  # for commits that reached the repository without going through those hooks.
  # Known upstream limits, left as they are: a PR scan covers only the first 30 of its
  # commits and skips what a merge commit brings in (gitleaks-action#187, #236).
  secret-scan-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan the PR's commits
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action pins an older gitleaks otherwise.
          GITLEAKS_VERSION: latest
          # Commenting on the PR needs a write token this workflow does not grant.
          GITLEAKS_ENABLE_COMMENTS: "false"

  secret-scan-trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the action walks history from the base to the head
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # A live or unknown candidate fails the job, and so does a commit the scan
          # cannot read.
          extra_args: --results=verified,unknown --fail-on-scan-errors

  # Stays red while dotfiles `main` carries other shared tasks than the pin in
  # mise.toml does, so it is a reminder rather than a required check; exit 2 (it
  # could not tell) fails it too. It runs on the schedule as well, since a
  # dotfiles change reaches no pull request here by itself. `contents: write` is
  # for `--bump`, which pushes the moved pin to a branch when the check fails
  # (dotfiles `tasks/README.md`, `shared-tasks:check`).
  shared-tasks-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # as in `markdown-lint`
          install: false # the task calls git and mise alone
      - run: mise run shared-tasks:check -- --bump
