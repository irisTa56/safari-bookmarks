[settings]
# mise skips a `git::` entry of `task_config.includes` unless this is on
# (jdx/mise#14114), and every shared task below goes with it. It turns on every
# feature mise marks experimental, not this one alone.
experimental = true

[tools]
biome = "latest"
lychee = "latest"
node = "24"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"

# The pre-commit hook is regenerated on every install, as in dotfiles: it only
# runs the pre-commit task. The push scan is registered in git's config instead,
# since it needs git's remote argument and ref lines on stdin, which only a hook
# registered there receives (git 2.54+; see dotfiles' tasks/README.md). So are
# the hook that keeps what `install` puts outside the repository current with
# the main checkout. Changes reach that checkout only by `git pull` once their
# pull request is merged (CLAUDE.md), so post-merge is the one event to follow.
[hooks]
postinstall = '''
mise generate git-pre-commit --write --task=pre-commit
git config hook.secrets-push-scan.event pre-push
git config hook.secrets-push-scan.command 'mise run secrets:push-scan'
git hook list pre-push 2>/dev/null | grep -qx secrets-push-scan || echo "warning: this git ignores hook.* config, so pushes are not scanned; git 2.54 or later runs it" >&2
git config hook.install-post-merge.event post-merge
git config hook.install-post-merge.command 'mise run install:hook'
if [ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ]; then mise run install; fi
'''

# `secrets:commit-scan` (per commit, gitleaks), `secrets:push-scan` (per push,
# trufflehog), `link-check:staged` (per commit, lychee over the network) and
# `shared-tasks:check` come from dotfiles' shared task library, whose
# `tasks/README.md` says why `ref` is a full sha on its `main`.
[task_config]
includes = [
  "git::https://github.com/irisTa56/dotfiles.git//tasks?ref=7d617e18718c88780c6bccd8975e8347688d8024",
]

# CI runs each `qa:` task as a job of its own (.github/workflows/ci.yml), so a new
# `qa:` task needs a job there too. `**`, not `*`: mise's `*` matches a single
# task segment and would leave `qa:links:offline` out. The shared scans sit
# outside `qa:`: CI scans a pull request's commits with its own jobs, and a
# networked link check would gate a pull request on third-party hosts.
[tasks.pre-commit]
description = "Run pre-commit checks"
depends = ["qa:**", "secrets:commit-scan", "link-check:staged"]

# Nothing here is built: Chrome loads extension/ as is and Node runs scripts/.
# Biome formats and lints both (biome.json), and tsc type-checks their
# JavaScript, the extension against Chrome's API types (tsconfig.json) and the
# exporter against Node's (scripts/tsconfig.json), installing the locked dev
# dependencies on first use. They are type definitions and tsc alone, which run
# no install script, and Dependabot merges their bumps unread, so none is run.
[tasks."qa:js"]
description = "Lint, check formatting of and type-check the JavaScript"
run = [
  "biome ci --error-on-warnings",
  "{ [ -d node_modules ] || npm ci --ignore-scripts --no-audit --no-fund --silent; } && node_modules/.bin/tsc -p . && node_modules/.bin/tsc -p scripts",
]

[tasks."qa:sh"]
description = "Lint and check formatting of shell scripts"
run = ["shellcheck scripts/*.sh", "shfmt -i 2 -d scripts/*.sh"]

[tasks."qa:md"]
description = "Lint markdown files"
run = "rumdl check"

# Offline, so a pull request never waits on a third-party host; the weekly
# workflow and `check:links` request every link.
[tasks."qa:links:offline"]
description = "Check links offline (no network)"
run = "lychee --offline --no-progress --config lychee.toml ."

[tasks."check:links"]
description = "Check links in the repo"
run = "lychee -v --config lychee.toml ."

[tasks."fmt:js"]
description = "Format and fix the JavaScript, JSON, CSS and HTML"
run = "biome check --write"

[tasks."fmt:sh"]
description = "Format shell scripts"
run = "shfmt -i 2 -w scripts/*.sh"

[tasks."fmt:md"]
description = "Format markdown files"
run = "rumdl check --fix"

[tasks.fmt]
description = "Format every file the checks cover"
depends = ["fmt:*"]

# Everything outside the repository lives in one directory, D below: the
# exporter as a symlink back into scripts/, so an edit there takes effect with
# no reinstall, the native host as a copy, and the export they share. The host
# cannot be a link: a process Chrome starts is refused reading anything under
# ~/Documents ("Operation not permitted", so Chrome reports "Native host has
# exited"), the script a link resolves to included. my-foam's daemon
# runs D/export_bookmarks.js (README.md "Running"), and Chrome's registration
# names D/open_in_safari_host.sh. Chrome derives an unpacked extension's ID from
# its directory's path (SHA-256, first 32 hex digits spelled a-p), and the host
# allows only that ID. `mise install` runs it in the main checkout, and the
# post-merge hook above again through `install:hook`; an edit to the host is
# tried before it is merged by running this by hand.
[tasks.install]
description = "Install the exporter and the native host out of the repository and register the host with Chrome"
run = """
set -eu
ext=$(cd "{{config_root}}/extension" && pwd -P)
scripts=$(cd "{{config_root}}/scripts" && pwd -P)
id=$(printf %s "$ext" | shasum -a 256 | cut -c1-32 | tr 0-9a-f a-p)
d="$HOME/Library/Application Support/safari-bookmarks"
hosts="$HOME/Library/Application Support/Google/Chrome/NativeMessagingHosts"
mkdir -p "$d" "$hosts"
ln -sfn "$scripts/export_bookmarks.js" "$d/export_bookmarks.js"
rm -f "$d/open_in_safari_host.sh"
install -m 755 "$scripts/open_in_safari_host.sh" "$d/open_in_safari_host.sh"
cat > "$hosts/local.safari_bookmarks.open_in_safari.json" <<JSON
{
  "name": "local.safari_bookmarks.open_in_safari",
  "description": "Hand pages to Safari and read Safari's bookmarks for the Safari Bookmarks extension",
  "path": "$d/open_in_safari_host.sh",
  "type": "stdio",
  "allowed_origins": ["chrome-extension://$id/"]
}
JSON
echo "installed into $d for chrome-extension://$id/"
"""

# After a merge, install again when it changed what install copies or does.
# Only the main checkout installs: the extension Chrome loads, and so the ID the
# host allows, is the one in that checkout, and a worktree would overwrite its
# host with its own branch's. Quiet when nothing went wrong, as a git hook.
[tasks."install:hook"]
description = "Install again after a merge that changed the host or mise.toml, in the main checkout only"
hide = true
run = '''
[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0
git diff --quiet ORIG_HEAD HEAD -- scripts/open_in_safari_host.sh mise.toml && exit 0
mise run install >/dev/null
'''
