<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safari Bookmarks</title>
<link rel="stylesheet" href="panel.css">
<script type="module" src="panel.js"></script>
</head>
<body>
<header>
<!-- biome-ignore lint/a11y/noAutofocus: the panel is opened to filter, so typing goes straight there -->
<input id="q" type="search" placeholder="Filter by title or URL" autofocus>
<button id="reload" type="button" title="Read the bookmarks again">↻</button>
<button id="smaller" type="button" title="Smaller text">A−</button>
<button id="larger" type="button" title="Larger text">A+</button>
<p class="meta"><span id="status"></span></p>
</header>
<main id="bookmarks"></main>
</body>
</html>
